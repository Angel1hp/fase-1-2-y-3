<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0066cc">
    <meta name="description" content="Lector de archivos PDF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MiPDF">
    <title>Mi Lector PDF</title>
    <link rel="shortcut icon" href="icono.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono-192.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <h2>📄 Mi Lector PDF</h2>
            <button id="btn-salir" class="btn-salir" title="Salir de la aplicación">
                <span class="icono-salir">✕</span> Salir
            </button>
        </header>

        <label class="btn-abrir" for="subir-pdf">Abrir PDF</label>
        <input type="file" id="subir-pdf" accept=".pdf" />

        <div id="mensaje-estado" class="mensaje-estado oculto"></div>

        <div class="controles">
            <button id="btn-anterior" disabled>&#8592; Anterior</button>
            <span id="info-pagina">Página: 0 / 0</span>
            <button id="btn-siguiente" disabled>Siguiente &#8594;</button>
        </div>

        <div class="visor-pdf">
            <div id="placeholder" class="placeholder">
                <span>Abre un PDF para comenzar</span>
            </div>
            <canvas id="canvas-pdf"></canvas>

            <!-- Barra de Controles Flotante Premium -->
            <div id="floating-controls" class="visor-floating-controls oculto">
                <div class="control-grupo paginacion-floating">
                    <button id="btn-anterior-float" class="btn-float" title="Página Anterior">&#8592;</button>
                    <span id="info-pagina-float">0 / 0</span>
                    <button id="btn-siguiente-float" class="btn-float" title="Siguiente Página">&#8594;</button>
                </div>
                <div class="divisor-vertical float-nav-divider"></div>
                <div class="control-grupo zoom-floating">
                    <button id="btn-zoom-out" class="btn-float" title="Alejar (Zoom -)">-</button>
                    <span id="zoom-porcentaje" title="Restablecer zoom a 100%">100%</span>
                    <button id="btn-zoom-in" class="btn-float" title="Acercar (Zoom +)">+</button>
                </div>
                <div class="divisor-vertical"></div>
                <button id="btn-maximizar" class="btn-float" title="Maximizar / Restaurar">
                    <span class="icono-max">⛶</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Pantalla de Despedida (Goodbye Screen) Premium -->
    <div id="pantalla-despedida" class="pantalla-despedida oculto">
        <div class="despedida-contenido">
            <div class="despedida-ilustracion">👋</div>
            <h3>¡Hasta pronto!</h3>
            <p>La sesión de <strong>Mi Lector PDF</strong> ha finalizado.</p>
            <p class="despedida-secundario">Ya puedes cerrar esta ventana de forma segura.</p>
            <button id="btn-volver-despedida" class="btn-volver">
                Volver a la aplicación
            </button>
        </div>
    </div>

    <!-- Notificación de Nueva Versión (Snackbar Premium) -->
    <div id="notificacion-update" class="notificacion-update oculto">
        <div class="notificacion-cuerpo">
            <span class="notificacion-icono">🚀</span>
            <div class="notificacion-texto">
                <h4>Nueva versión disponible</h4>
                <p>Hay mejoras listas en el servidor.</p>
            </div>
        </div>
        <div class="notificacion-acciones">
            <button id="btn-update-actualizar" class="btn-update-accion">Actualizar</button>
            <button id="btn-update-ignorar" class="btn-update-cerrar" title="Ignorar">✕</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
